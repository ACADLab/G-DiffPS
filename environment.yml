name: gdiffps
channels:
  - pyg
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch>=2.0
  - pytorch-cuda=11.8
  - pyg  # installs torch-geometric and core graph libraries cleanly
  - pip
  - pip:
      - gymnasium>=1.0
      - stable-baselines3>=2.3
      - scipy>=1.10
      - tqdm>=4.65
      - matplotlib>=3.7
      - requests>=2.31
      - openai>=1.0
      - scikit-learn>=1.3
